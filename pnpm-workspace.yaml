packages:
  - packages/*

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - bcrypt
  - bufferutil
  - esbuild
  - go-ptt
  - node-datachannel
  - protobufjs
  - sharp
  - sqlite3
  - unrs-resolver
  - utf-8-validate
  - utp-native

patchedDependencies:
  stremthru: patches/stremthru.patch

# pnpm 11 replaced onlyBuiltDependencies with allowBuilds (a map). Keeping
# both for cross-version compatibility (pnpm 10 reads onlyBuiltDependencies,
# pnpm 11 reads allowBuilds). See https://pnpm.io/blog/releases/11.0
allowBuilds:
  '@tailwindcss/oxide': true
  bcrypt: true
  bufferutil: true
  esbuild: true
  go-ptt: true
  node-datachannel: true
  protobufjs: true
  sharp: true
  sqlite3: true
  unrs-resolver: true
  utf-8-validate: true
  utp-native: true
